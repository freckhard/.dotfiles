# Send prefix
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Set easier window split keys
bind-key Left split-window -h -c "#{pane_current_path}"
bind-key Right split-window -h -c "#{pane_current_path}" 
bind-key Up split-window -v -c "#{pane_current_path}" 
bind-key Down split-window -v -c "#{pane_current_path}" 

# Mouse mode
setw -g mouse on

# Bottom bar customization
set -g status-style bg=blue
set -g status-right "[%Y-%m-%d] [%H:%M:%S]"
set -g status-interval 1

# Open new panes with from $PWD
bind  c  new-window      -c "#{pane_current_path}"
#bind  %  split-window -h -c "#{pane_current_path}"
#bind '"' split-window -v -c "#{pane_current_path}"


# Easy config reload
bind-key r source-file $HOME/.tmux.conf \; display-message "~/.tmux.conf reloaded."
