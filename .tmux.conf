# Set another prefix
set-option -g prefix  C-b
set-option -g prefix2 C-a

# ZSH addition
unbind-key C-a
  bind-key C-a send-prefix

# Enable mouse mode
set-option -g mouse on

# Use Alt+Arrowkeys to switch panes
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

# Shift arrows to switch windows
bind-key -n S-Left  previous-window
bind-key -n S-Right next-window

# Ctrl+Shift arrows to reorder windows
bind-key -n C-S-Left  swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Set easier windowpane split keys
bind-key Left  split-window -h -c "#{pane_current_path}"
bind-key Right split-window -h -c "#{pane_current_path}" 
bind-key Up    split-window -v -c "#{pane_current_path}" 
bind-key Down  split-window -v -c "#{pane_current_path}" 

# Open new window
bind-key c new-window -c "#{pane_current_path}"

# Bottom bar & customizations
set-option -g status-style bg=blue
set-option -g status-right "[%Y-%m-%d] [%H:%M:%S]"
set-option -g status-interval 1
set-option -g default-terminal "xterm-256color"
set-option -g display-time 900
set-option -g display-panes-time 900

# Add key for config reload within tmux
bind-key r source-file $HOME/.tmux.conf \; display-message " --> tmux.conf reloaded."

